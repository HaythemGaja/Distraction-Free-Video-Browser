<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CinemaStream Pro</title>
    <style>
        :root {
            --bg-body: #0d0f15;
            --bg-nav: #141722;
            --bg-card: #1c202e;
            --accent-gold: #f5b041;
            --accent-cyan: #00f2fe;
            --accent-green: #2ecc71;
            --text-main: #e6e9f2;
            --text-sub: #868fa6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 350px; background-color: var(--bg-body); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 14px; display: flex; flex-direction: column; gap: 12px;
        }

        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #232838; padding-bottom: 8px; }
        .header h1 { font-size: 14px; font-weight: 800; color: var(--accent-cyan); letter-spacing: 0.5px; }

        /* Tabs */
        .nav-tabs { display: flex; gap: 4px; background: #141722; padding: 3px; border-radius: 8px; }
        .nav-tab {
            flex: 1; padding: 5px; font-size: 11px; font-weight: bold; background: none; border: none;
            color: var(--text-sub); border-radius: 6px; cursor: pointer; text-align: center;
        }
        .nav-tab.active { background: var(--bg-card); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }

        .tab-content { display: none; flex-direction: column; gap: 10px; }
        .tab-content.active { display: flex; }

        /* Action Buttons */
        .btn-row { display: flex; gap: 6px; }
        button, select {
            padding: 6px 10px; border-radius: 8px; border: 1px solid #2c344a;
            background-color: var(--bg-card); color: #eee; font-size: 11px; font-weight: 600; cursor: pointer;
            outline: none; transition: 0.15s;
        }
        button:hover, select:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }

        .btn-gold { background: var(--accent-gold); color: #111; border: none; font-weight: bold; width: 100%; padding: 8px; }
        .btn-gold:hover { background: #f7be65; color: #000; }

        /* Section */
        .section { background: var(--bg-card); border: 1px solid #282e42; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .section-title { font-size: 10px; font-weight: 700; color: var(--accent-gold); text-transform: uppercase; }
        .row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }

        .toggle-btn { padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; border: 1px solid #333; cursor: pointer; }
        .toggle-btn.on { background: var(--accent-green) !important; color: #000 !important; }
        .toggle-btn.off { background: #33384a !important; color: #8a92a6 !important; }

        /* Watch Later */
        #wl-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .wl-item { background: #131620; border: 1px solid #282e42; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 11px; }
        .wl-title { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; }
        .wl-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
        .wl-play { background: var(--accent-cyan); color: #000; border: none; padding: 3px 8px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .wl-share { background: #242938; color: var(--accent-cyan); border: 1px solid var(--accent-cyan); padding: 3px 6px; border-radius: 4px; cursor: pointer; }
        .wl-del { color: #ff5f56; background: none; border: none; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎬 CINEMASTREAM PRO</h1>
        <span style="font-size: 10px; color: var(--accent-green);">● Active</span>
    </div>

    <div class="nav-tabs">
        <button class="nav-tab active" data-tab="controls">Controls</button>
        <button class="nav-tab" data-tab="panels">FB Panels</button>
        <button class="nav-tab" data-tab="watchlater">Watch Later (<span id="wl-count">0</span>)</button>
    </div>

    <!-- TAB 1: QUICK CONTROLS -->
    <div id="tab-controls" class="tab-content active">
        <div class="btn-row">
            <button id="btn-pip" style="flex:1;">🪟 PiP Mode</button>
            <button id="btn-focus" style="flex:1;">🔲 Focus</button>
        </div>

        <div class="section">
            <div class="section-title">⚡ Playback Settings</div>
            <div class="row">
                <span>Speed:</span>
                <select id="speed-select" style="color:var(--accent-cyan);">
                    <option value="0.5">0.5x</option>
                    <option value="0.75">0.75x</option>
                    <option value="1.0" selected>1.0x (Normal)</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="1.75">1.75x</option>
                    <option value="2.0">2.0x (Fast)</option>
                </select>
            </div>
            <div class="row">
                <span>Auto-Next Video:</span>
                <button id="toggle-autonext" class="toggle-btn on">ON</button>
            </div>
            <div class="row">
                <span>FB Comment Sort:</span>
                <select id="comment-sort-select" style="color:var(--accent-cyan);">
                    <option value="newest" selected>All Comments</option>
                    <option value="all">Newest</option>
                    <option value="relevant">Most Relevant</option>
                    <option value="off">Off</option>
                </select>
            </div>
        </div>
    </div>

    <!-- TAB 2: FB PANELS & FEED WIDTH -->
    <div id="tab-panels" class="tab-content">
        <div class="section">
            <div class="section-title">🎛️ Facebook Panels & Feed Width</div>
            <div class="row">
                <span>Feed Width:</span>
                <span id="feed-width-label" style="color:var(--accent-cyan); font-weight:bold;">680px</span>
            </div>
            <input type="range" id="feed-width-slider" min="500" max="1300" step="20" value="680" style="accent-color:var(--accent-cyan);">

            <div class="row"><span>Top Navigation Bar:</span><button id="toggle-topbar" class="toggle-btn on">SHOW</button></div>
            <div class="row"><span>Stories Tray:</span><button id="toggle-stories" class="toggle-btn on">SHOW</button></div>
            <div class="row"><span>Left Sidebar:</span><button id="toggle-leftrail" class="toggle-btn off">HIDE</button></div>
            <div class="row"><span>Right Chat / Sidebar:</span><button id="toggle-rightrail" class="toggle-btn off">HIDE</button></div>
            <div class="row"><span>Comments Section:</span><button id="toggle-comments" class="toggle-btn on">SHOW</button></div>
        </div>
    </div>

    <!-- TAB 3: WATCH LATER QUEUE -->
    <div id="tab-watchlater" class="tab-content">
        <button id="save-current-btn" class="btn-gold">⭐ Save Current Video</button>
        <div id="wl-list"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
