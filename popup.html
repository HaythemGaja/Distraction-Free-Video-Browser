<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StreamFlow Pro</title>
    <style>
        :root {
            --gmc-bg: #1f2125;
            --gmc-card: #292a2d;
            --gmc-card-hover: #32353a;
            --gmc-blue: #8ab4f8;
            --gmc-blue-btn: #a8c7fa;
            --gmc-blue-dark: #041e49;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0a6;
            --accent-gold: #f5b041;
            --accent-green: #2ecc71;
            --accent-cyan: #00f2fe;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 360px; background-color: var(--gmc-bg); color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 12px; display: flex; flex-direction: column; gap: 10px; user-select: none;
        }

        /* ================= 1. NATIVE CHROME GMC MEDIA CARD ================= */
        .gmc-card {
            background-color: var(--gmc-card); border-radius: 12px; padding: 14px;
            display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid #383a3e;
        }

        .gmc-header { display: flex; justify-content: space-between; align-items: center; }
        .gmc-domain-box { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-secondary); font-weight: 600; }
        .gmc-domain-icon { font-size: 12px; }

        .gmc-pip-btn { background: none; border: none; color: var(--text-secondary); font-size: 15px; cursor: pointer; padding: 2px; }
        .gmc-pip-btn:hover { color: #fff; }

        .gmc-content-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .gmc-info { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 2px; }
        .gmc-title { font-size: 13px; font-weight: 700; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .gmc-sub { font-size: 10px; color: var(--text-secondary); }

        /* Big Circular Play Button */
        .gmc-play-circle {
            width: 44px; height: 44px; border-radius: 50%; background-color: var(--gmc-blue-btn);
            color: var(--gmc-blue-dark); border: none; display: flex; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer; flex-shrink: 0; transition: transform 0.15s;
        }
        .gmc-play-circle:hover { transform: scale(1.05); }

        /* Timeline Scrubber */
        .gmc-timeline-box { display: flex; flex-direction: column; gap: 4px; }
        .gmc-scrub-slider {
            width: 100%; height: 3px; accent-color: var(--gmc-blue); cursor: pointer;
            background: #3c4043; border-radius: 2px; -webkit-appearance: none;
        }
        .gmc-scrub-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: var(--gmc-blue); }

        .gmc-time-row { display: flex; justify-content: space-between; font-size: 9px; color: var(--text-secondary); }

        /* Transport Seek Controls */
        .gmc-controls-row { display: flex; justify-content: center; align-items: center; gap: 20px; }
        .gmc-icon-btn { background: none; border: none; color: var(--text-primary); font-size: 14px; cursor: pointer; padding: 4px; border-radius: 50%; }
        .gmc-icon-btn:hover { background: rgba(255,255,255,0.08); color: var(--gmc-blue); }

        /* ================= 2. COLLAPSIBLE ACCORDION ROWS ================= */
        .gmc-accordion { background-color: var(--gmc-card); border-radius: 10px; border: 1px solid #383a3e; overflow: hidden; }
        .gmc-row-header {
            padding: 10px 12px; display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; font-weight: 600; cursor: pointer; transition: background 0.15s;
        }
        .gmc-row-header:hover { background-color: var(--gmc-card-hover); }
        .gmc-row-body { padding: 10px 12px; border-top: 1px solid #333539; display: none; flex-direction: column; gap: 8px; font-size: 11px; }
        .gmc-accordion.open .gmc-row-body { display: flex; }

        .row-item { display: flex; justify-content: space-between; align-items: center; }
        
        button, select {
            padding: 4px 8px; border-radius: 6px; border: 1px solid #44474f;
            background-color: #1a1c20; color: #eee; font-size: 10px; font-weight: 600; cursor: pointer; outline: none;
        }
        button:hover, select:hover { border-color: var(--gmc-blue); color: var(--gmc-blue); }

        .btn-gold { background: var(--accent-gold); color: #000; border: none; font-weight: bold; padding: 6px; width: 100%; border-radius: 6px; }

        /* Watch Later Items */
        #wl-list { max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
        .wl-item { background: #1a1c20; border: 1px solid #383a3e; border-radius: 6px; padding: 6px 8px; display: flex; flex-direction: column; gap: 3px; font-size: 10px; }
        .wl-title { font-weight: bold; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .wl-actions { display: flex; justify-content: space-between; align-items: center; }
        .wl-btn-play { background: var(--gmc-blue); color: #000; border: none; padding: 2px 6px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .wl-btn-del { color: #ff5f56; background: none; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <!-- 1. Native Chrome Media Control Card -->
    <div class="gmc-card">
        <div class="gmc-header">
            <div class="gmc-domain-box">
                <span class="gmc-domain-icon">⚡</span>
                <span id="gmc-domain">hentaihaven.xxx</span>
            </div>
            <button id="btn-pip-top" class="gmc-pip-btn" title="Picture-in-Picture">🗔</button>
        </div>

        <div class="gmc-content-row">
            <div class="gmc-info">
                <div id="gmc-title" class="gmc-title">Loading Active Media...</div>
                <div class="gmc-sub">StreamFlow Media Engine</div>
            </div>
            <button id="btn-play-pause" class="gmc-play-circle">▶</button>
        </div>

        <!-- Progress Scrubber -->
        <div class="gmc-timeline-box">
            <input type="range" id="gmc-scrubber" class="gmc-scrub-slider" min="0" max="100" value="0">
            <div class="gmc-time-row">
                <span id="time-current">0:00</span>
                <span id="time-duration">0:00</span>
            </div>
        </div>

        <!-- Transport Buttons -->
        <div class="gmc-controls-row">
            <button id="btn-rewind" class="gmc-icon-btn" title="Rewind -10s">⏮ 10</button>
            <button id="btn-mute" class="gmc-icon-btn" title="Mute Toggle (M)">🔊</button>
            <button id="btn-forward" class="gmc-icon-btn" title="Forward +10s">10 ⏭</button>
        </div>
    </div>

    <!-- 2. Accordion: Speed & Audio Controls -->
    <div class="gmc-accordion open">
        <div class="gmc-row-header" onclick="this.parentElement.classList.toggle('open')">
            <span>⚡ Playback & Audio Controls</span>
            <span>▾</span>
        </div>
        <div class="gmc-row-body">
            <div class="row-item">
                <span>Playback Speed:</span>
                <select id="speed-select" style="color:var(--gmc-blue);">
                    <option value="0.5">0.5x</option>
                    <option value="0.75">0.75x</option>
                    <option value="1.0" selected>1.0x (Normal)</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="1.75">1.75x</option>
                    <option value="2.0">2.0x (Fast)</option>
                </select>
            </div>
            <div class="row-item">
                <span>Global Volume:</span>
                <input type="range" id="volume-slider" min="0" max="100" step="5" value="100" style="width:130px; accent-color:var(--gmc-blue);">
            </div>
            <div class="row-item">
                <span>Audio EQ Preset:</span>
                <select id="eq-select" style="color:var(--accent-gold);">
                    <option value="flat" selected>Flat (Default)</option>
                    <option value="vocal">Vocal Clarity</option>
                    <option value="bass">Bass Boost</option>
                    <option value="night">Night Mode</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 3. Accordion: Tools & A-B Looper -->
    <div class="gmc-accordion">
        <div class="gmc-row-header" onclick="this.parentElement.classList.toggle('open')">
            <span>🔁 A-B Loop & Tools</span>
            <span>▾</span>
        </div>
        <div class="gmc-row-body">
            <div style="display:flex; gap:4px;">
                <button id="btn-ab-a" style="flex:1;">Set A ([)</button>
                <button id="btn-ab-b" style="flex:1;">Set B (])</button>
                <button id="btn-ab-clear" style="flex:1; color:#ff5f56;">Clear (\)</button>
            </div>
            <div style="display:flex; gap:4px;">
                <button id="btn-frame-back" style="flex:1;">⏪ Frame (,)</button>
                <button id="btn-frame-fwd" style="flex:1;">Frame ⏩ (.)</button>
                <button id="btn-shot" style="flex:1;">📸 Snap (S)</button>
            </div>
        </div>
    </div>

    <!-- 4. Accordion: Watch Later Queue -->
    <div class="gmc-accordion">
        <div class="gmc-row-header" onclick="this.parentElement.classList.toggle('open')">
            <span>⭐ Watch Later Queue (<span id="wl-count">0</span>)</span>
            <span>▾</span>
        </div>
        <div class="gmc-row-body">
            <button id="btn-save-wl" class="btn-gold">⭐ Save Active Video</button>
            <div id="wl-list"></div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
