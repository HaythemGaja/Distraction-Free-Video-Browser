<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StreamFlow Pro</title>
    <style>
        :root {
            --gmc-bg: #1e2024;
            --gmc-card: #292a2d;
            --gmc-card-hover: #32353a;
            --gmc-blue: #8ab4f8;
            --gmc-blue-btn: #a8c7fa;
            --gmc-blue-dark: #041e49;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0a6;
            --accent-gold: #f5b041;
            --accent-green: #2ecc71;
            --accent-cyan: #00f2fe;
            --border-color: #383a3e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 360px; background-color: var(--gmc-bg); color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 12px; display: flex; flex-direction: column; gap: 10px; user-select: none;
        }

        /* ================= 1. NATIVE CHROME GMC MEDIA CARD ================= */
        .gmc-card {
            background-color: var(--gmc-card); border-radius: 12px; padding: 14px;
            display: flex; flex-direction: column; gap: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
        }

        .gmc-header { display: flex; justify-content: space-between; align-items: center; }
        .gmc-domain-box { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-secondary); font-weight: 600; }
        .gmc-domain-icon { font-size: 12px; }

        .gmc-header-actions { display: flex; align-items: center; gap: 6px; }

        /* Speed Badge on the Player Card */
        .card-speed-select {
            background-color: #1e2024; color: var(--gmc-blue); border: 1px solid #3c4043;
            border-radius: 12px; padding: 2px 6px; font-size: 10px; font-weight: bold; cursor: pointer; outline: none;
        }
        .card-speed-select:hover { border-color: var(--gmc-blue); }

        .gmc-pip-btn { background: none; border: none; color: var(--text-secondary); font-size: 14px; cursor: pointer; padding: 2px; }
        .gmc-pip-btn:hover { color: #fff; }

        /* Main Content Row: Title on Left, Big Circular Play/Pause on Right */
        .gmc-content-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .gmc-info { flex: 1; overflow: hidden; display: flex; flex-direction: column; gap: 3px; }
        .gmc-title { font-size: 13px; font-weight: 700; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .gmc-sub { font-size: 10px; color: var(--text-secondary); }

        .gmc-play-circle {
            width: 44px; height: 44px; border-radius: 50%; background-color: var(--gmc-blue-btn);
            color: var(--gmc-blue-dark); border: none; display: flex; align-items: center; justify-content: center;
            font-size: 18px; cursor: pointer; flex-shrink: 0; transition: transform 0.15s;
        }
        .gmc-play-circle:hover { transform: scale(1.06); }

        /* Timeline Scrubber matching screenshot */
        .gmc-timeline-container { display: flex; align-items: center; gap: 8px; width: 100%; }
        
        .gmc-scrub-slider {
            flex: 1; height: 3px; accent-color: var(--gmc-blue); cursor: pointer;
            background: #3c4043; border-radius: 2px; -webkit-appearance: none;
        }
        .gmc-scrub-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: var(--gmc-blue); }

        /* Transport Row matching screenshot: |<< (10) [Scrubber] (10) >>| */
        .gmc-controls-bar { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
        
        .gmc-transport-btn {
            background: none; border: none; color: var(--text-secondary); font-size: 13px; font-weight: bold;
            cursor: pointer; padding: 4px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
            transition: 0.15s;
        }
        .gmc-transport-btn:hover { color: var(--text-primary); background: rgba(255,255,255,0.06); }
        .gmc-seek-btn { font-size: 11px; padding: 2px 6px; border-radius: 12px; }

        .time-badge { font-size: 9px; color: var(--text-secondary); min-width: 28px; text-align: center; }

        /* ================= 2. ROWS UNDERNEATH (MATCHING SCREENSHOT LIST STYLE) ================= */
        .gmc-list { display: flex; flex-direction: column; }
        
        .gmc-list-row {
            display: flex; justify-content: space-between; align-items: center; padding: 9px 4px;
            border-top: 1px solid var(--border-color); font-size: 12px; color: var(--text-primary);
        }
        .gmc-list-row:first-child { border-top: none; }

        .gmc-row-label { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 11px; }

        /* Switch Toggles */
        .gmc-switch {
            width: 32px; height: 18px; background: #3c4043; border-radius: 10px; position: relative;
            cursor: pointer; transition: background 0.2s;
        }
        .gmc-switch::after {
            content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
            background: #fff; border-radius: 50%; transition: transform 0.2s;
        }
        .gmc-switch.active { background: var(--gmc-blue); }
        .gmc-switch.active::after { transform: translateX(14px); background: #041e49; }

        /* General Dropdowns & Inputs */
        select, input[type="range"] {
            outline: none; font-size: 10px; font-weight: bold; border-radius: 6px; border: 1px solid #3c4043;
            background-color: var(--gmc-card); color: var(--text-primary); padding: 3px 6px;
        }

        .btn-action-small {
            padding: 3px 8px; border-radius: 6px; border: 1px solid #3c4043; background: var(--gmc-card);
            color: var(--text-primary); font-size: 10px; font-weight: bold; cursor: pointer;
        }
        .btn-action-small:hover { border-color: var(--gmc-blue); color: var(--gmc-blue); }

        /* Watch Later Drawer */
        #wl-container { display: none; flex-direction: column; gap: 6px; padding: 8px 0; border-top: 1px solid var(--border-color); }
        #wl-container.open { display: flex; }
        #wl-list { max-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        .wl-item { background: var(--gmc-card); border: 1px solid var(--border-color); border-radius: 6px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; font-size: 10px; }
        .wl-title { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; }
        .wl-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 2px; }
        .wl-btn-play { background: var(--gmc-blue); color: #000; border: none; padding: 2px 6px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .wl-btn-del { color: #ff5f56; background: none; border: none; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <!-- 1. Chrome Native Media Control Card -->
    <div class="gmc-card">
        <div class="gmc-header">
            <div class="gmc-domain-box">
                <span class="gmc-domain-icon">⚡</span>
                <span id="gmc-domain">hentaihaven.xxx</span>
            </div>
            
            <div class="gmc-header-actions">
                <!-- Playback Speed Directly On Card -->
                <select id="card-speed-select" class="card-speed-select" title="Playback Speed">
                    <option value="0.5">0.5x</option>
                    <option value="0.75">0.75x</option>
                    <option value="1.0" selected>1.0x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="1.75">1.75x</option>
                    <option value="2.0">2.0x</option>
                    <option value="2.5">2.5x</option>
                    <option value="3.0">3.0x</option>
                </select>

                <button id="btn-pip" class="gmc-pip-btn" title="Picture-in-Picture">🗔</button>
            </div>
        </div>

        <!-- Title & Big Circular Play Button -->
        <div class="gmc-content-row">
            <div class="gmc-info">
                <div id="gmc-title" class="gmc-title">Loading Media...</div>
                <div class="gmc-sub">StreamFlow Engine Active</div>
            </div>
            <button id="btn-play-pause" class="gmc-play-circle" title="Play / Pause (Space)">▶</button>
        </div>

        <!-- Controls Bar Matching Screenshot (|<< 10 [Timeline] 10 >>|) -->
        <div class="gmc-controls-bar">
            <button id="btn-prev" class="gmc-transport-btn" title="Previous / Restart">⏮</button>
            <button id="btn-rewind" class="gmc-transport-btn gmc-seek-btn" title="Rewind -10s">⟲ 10</button>
            
            <div class="gmc-timeline-container">
                <span id="time-current" class="time-badge">0:00</span>
                <input type="range" id="gmc-scrubber" class="gmc-scrub-slider" min="0" max="100" value="0">
                <span id="time-duration" class="time-badge">0:00</span>
            </div>

            <button id="btn-forward" class="gmc-transport-btn gmc-seek-btn" title="Forward +10s">10 ⟳</button>
            <button id="btn-next" class="gmc-transport-btn" title="Next Video">⏭</button>
        </div>
    </div>

    <!-- 2. Settings Rows Underneath (Styled Like Caption Settings in Screenshot) -->
    <div class="gmc-list">
        <!-- Global Volume Row -->
        <div class="gmc-list-row">
            <div class="gmc-row-label">
                <span>🔊</span>
                <span>Global Volume (<span id="volume-val">100%</span>)</span>
            </div>
            <input type="range" id="volume-slider" min="0" max="100" step="5" value="100" style="width:110px; accent-color:var(--gmc-blue);">
        </div>

        <!-- Audio EQ Preset Row -->
        <div class="gmc-list-row">
            <div class="gmc-row-label">
                <span>🎚️</span>
                <span>Audio Equalizer</span>
            </div>
            <select id="eq-select" style="color:var(--accent-gold);">
                <option value="flat" selected>Flat (Default)</option>
                <option value="vocal">Vocal Clarity</option>
                <option value="bass">Bass Boost</option>
                <option value="night">Night Mode</option>
            </select>
        </div>

        <!-- A-B Repeat Loop Row -->
        <div class="gmc-list-row">
            <div class="gmc-row-label">
                <span>🔁</span>
                <span>A-B Repeat Loop</span>
            </div>
            <div style="display:flex; gap:4px;">
                <button id="btn-ab-a" class="btn-action-small">Set A ([)</button>
                <button id="btn-ab-b" class="btn-action-small">Set B (])</button>
                <button id="btn-ab-clear" class="btn-action-small" style="color:#ff5f56;">✕ (\)</button>
            </div>
        </div>

        <!-- Quick Capture & Stepper Row -->
        <div class="gmc-list-row">
            <div class="gmc-row-label">
                <span>🎞️</span>
                <span>Frame Step & Snap</span>
            </div>
            <div style="display:flex; gap:4px;">
                <button id="btn-frame-back" class="btn-action-small">⏪ (,)</button>
                <button id="btn-frame-fwd" class="btn-action-small">⏩ (.)</button>
                <button id="btn-shot" class="btn-action-small" style="color:var(--accent-cyan);">📸 (S)</button>
            </div>
        </div>

        <!-- Auto-Play Next Toggle Row -->
        <div class="gmc-list-row">
            <div class="gmc-row-label">
                <span>⏩</span>
                <span>Auto-Play Next Video</span>
            </div>
            <div id="toggle-autonext" class="gmc-switch active"></div>
        </div>

        <!-- Ambient Glow Toggle Row -->
        <div class="gmc-list-row">
            <div class="gmc-row-label">
                <span>🌈</span>
                <span>Ambient Video Glow</span>
            </div>
            <div id="toggle-ambient" class="gmc-switch"></div>
        </div>

        <!-- Watch Later Row -->
        <div class="gmc-list-row" id="row-wl-toggle" style="cursor:pointer;">
            <div class="gmc-row-label">
                <span>⭐</span>
                <span>Watch Later Queue (<span id="wl-count">0</span>)</span>
            </div>
            <button id="btn-save-wl" class="btn-action-small" style="color:var(--accent-gold);">+ Save Video</button>
        </div>

        <!-- Watch Later List Container -->
        <div id="wl-container">
            <div id="wl-list"></div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
