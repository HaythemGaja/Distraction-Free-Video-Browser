<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CinemaStream Pro</title>
    <link rel="icon" href="icon.svg">
    <style>
        :root {
            --bg-main: #0b0c10;
            --bar-bg: #13151f;
            --accent: #00f2fe;
            --accent-glow: rgba(0, 242, 254, 0.4);
            --card-bg: #1c202d;
            --text-color: #e4e6eb;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg-main); color: var(--text-color); overflow: hidden; }

        /* ================= 1. TAB BAR ================= */
        #tab-bar-container {
            display: flex; background-color: #0b0c12; border-bottom: 1px solid #232738;
            overflow-x: auto; scrollbar-width: none; align-items: center; padding: 4px 10px 0 10px; gap: 6px;
        }
        #tab-bar-container::-webkit-scrollbar { display: none; }
        #tabs-list { display: flex; gap: 4px; align-items: center; }
        
        .tab {
            display: flex; align-items: center; gap: 8px; background-color: #161824; color: #8e95a5;
            padding: 6px 12px; border-radius: 8px 8px 0 0; font-size: 12px; font-weight: 600;
            cursor: pointer; max-width: 170px; min-width: 90px; border: 1px solid transparent; border-bottom: none;
            transition: 0.2s; white-space: nowrap; user-select: none;
        }
        .tab.active { background-color: var(--bar-bg); color: var(--accent); border-color: #2e3245; }
        .tab .tab-title { overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .tab .tab-close { background: none; border: none; color: #8e95a5; font-size: 11px; padding: 2px 4px; border-radius: 50%; cursor: pointer; }
        .tab .tab-close:hover { background-color: #e52d27; color: white; }

        .tab-btn { padding: 5px 9px; background-color: #181a26; border: 1px solid #282b3a; color: #eee; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; margin-bottom: 2px; }
        .tab-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* ================= 2. ORGANIZED 1-ROW TOOLBAR ================= */
        #toolbar {
            display: flex; flex-wrap: nowrap; padding: 6px 10px; background-color: var(--bar-bg);
            gap: 6px; align-items: center; border-bottom: 1px solid #282b3a; z-index: 100; overflow-x: auto;
        }
        #toolbar::-webkit-scrollbar { display: none; }
        
        .group { display: flex; gap: 4px; align-items: center; border-right: 1px solid #282b3a; padding-right: 6px; flex-shrink: 0; }
        .group:last-child { border-right: none; }

        #url-bar { width: 170px; padding: 5px 10px; border-radius: 16px; border: 1px solid #33394f; font-size: 12px; background-color: #0b0c10; color: #fff; outline: none; transition: 0.2s; }
        #url-bar:focus { border-color: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
        
        button, select {
            padding: 5px 8px; min-height: 28px; border-radius: 6px; border: 1px solid #33394f;
            background-color: var(--card-bg); color: #eee; font-size: 11px; font-weight: 600; cursor: pointer;
            transition: 0.15s; outline: none; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap;
        }
        button:hover, select:hover { background-color: #2b3042; border-color: var(--accent); color: var(--accent); }
        
        .nav-btn { background-color: transparent; font-size: 12px; border: none; padding: 4px 6px; }
        .hub-btn { background: linear-gradient(135deg, #00c6ff, #0072ff); color: #fff; border: none; font-weight: bold; }
        .watch-later-btn { background: linear-gradient(135deg, #f7971e, #ffd200); color: #000; border: none; font-weight: bold; }

        .account-select { background-color: #0b0c10; color: #00ff88; border: 1px solid #00ff88; font-weight: bold; }
        .mode-toggle-btn { background: #1877f2; color: #fff; border: none; }
        .blackout-btn { background: #000; color: #00f2fe; border: 1px solid #00f2fe; }
        .boost-btn { background: linear-gradient(135deg, #ff8c00, #e52d27); color: #fff; border: none; }
        .toggle-active { background-color: #00f2fe !important; color: #0b0c10 !important; font-weight: bold; }
        .speed-dropdown { background-color: #0b0c10; color: var(--accent); border: 1px solid var(--accent); font-weight: bold; }

        /* ================= 3. WORKSPACE ================= */
        #workspace { flex: 1; position: relative; display: flex; width: 100%; height: 100%; overflow: hidden; }
        #webviews-container { width: 100%; height: 100%; position: relative; }
        
        webview {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: none; background-color: var(--bg-main);
            opacity: 0; pointer-events: none; z-index: 1;
        }
        webview.active {
            opacity: 1; pointer-events: auto; z-index: 10;
        }

        /* ================= 4. WATCH LATER DRAWER ================= */
        #watch-later-drawer {
            position: absolute; top: 0; right: 0; width: 340px; max-width: 90vw; height: 100%;
            background-color: #13151f; border-left: 1px solid #282b3a; z-index: 200;
            display: flex; flex-direction: column; padding: 15px; box-shadow: -8px 0 25px rgba(0,0,0,0.8);
            transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #watch-later-drawer.open { transform: translateX(0); }

        .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #282b3a; }
        .drawer-title { font-size: 1.1rem; font-weight: bold; color: #ffd200; }
        .drawer-close { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
        
        #wl-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .wl-card {
            background-color: #1f222e; border: 1px solid #2c3040; border-radius: 10px; padding: 10px;
            display: flex; flex-direction: column; gap: 6px; font-size: 12px;
        }
        .wl-card-title { font-weight: bold; color: #e4e6eb; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .wl-card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
        .wl-play-btn { background-color: var(--accent); color: #000; border: none; padding: 4px 10px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .wl-del-btn { background: none; border: none; color: #ff4b4b; cursor: pointer; font-size: 14px; }

        /* ================= 5. START HUB ================= */
        #start-hub {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #191c28 0%, #0b0c10 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; transition: opacity 0.25s ease, visibility 0.25s; overflow-y: auto; padding: 20px;
        }
        #start-hub.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .hub-title { font-size: 2rem; font-weight: 800; margin-bottom: 4px; background: linear-gradient(90deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
        .hub-subtitle { font-size: 0.9rem; color: #8892b0; margin-bottom: 25px; text-align: center; }

        .hub-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 170px)); gap: 14px; justify-content: center; width: 100%; max-width: 800px; }
        .hub-card {
            background-color: var(--card-bg); border: 1px solid #282b3a; border-radius: 14px; padding: 18px 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
            transition: 0.2s; box-shadow: 0 6px 15px rgba(0,0,0,0.4);
        }
        .hub-card:hover { transform: translateY(-4px); border-color: var(--accent); }
        .hub-icon { font-size: 2.2rem; margin-bottom: 8px; }
        .hub-name { font-weight: 700; font-size: 12px; text-align: center; }
        .hub-tag { font-size: 10px; color: #8892b0; margin-top: 3px; text-align: center; }
    </style>
</head>
<body>

    <!-- 1. Top Tabs Bar -->
    <div id="tab-bar-container">
        <div id="tabs-list"></div>
        <button id="new-tab-btn" class="tab-btn">➕ Tab</button>
        <button id="save-wl-btn" class="tab-btn" style="background:#ffd200; color:#000;">⭐ Save</button>
        <button id="watch-later-btn" class="tab-btn watch-later-btn">📑 Watch Later (<span id="wl-count">0</span>)</button>
    </div>

    <!-- 2. Clean 1-Row Streamlined Toolbar -->
    <div id="toolbar">
        <!-- Navigation & Profile -->
        <div class="group">
            <button id="hub-toggle" class="hub-btn">🏠 Hub</button>
            <select id="account-select" class="account-select" title="Switch Account"></select>
            <button id="add-account-btn" title="Add Account">➕</button>
            <button id="back-btn" class="nav-btn">⬅</button>
            <button id="forward-btn" class="nav-btn">➡</button>
            <input type="text" id="url-bar" placeholder="URL / search...">
            <button id="go-btn">Go</button>
        </div>
        
        <!-- View & Stage Controls -->
        <div class="group">
            <button id="view-mode-btn" class="mode-toggle-btn">🌐 View</button>
            <button id="hide-feed-btn" title="Hide Feed & Comments">🛑 Feed</button>
            <button id="blackout-btn" class="blackout-btn" title="Pure Video Blackout">🕶️</button>
            <button id="focus-btn" title="Fullscreen Focus">🔲 Focus</button>
            <button id="pip-btn" title="Picture-in-Picture">🪟 PiP</button>
        </div>

        <!-- Playback & Audio -->
        <div class="group">
            <select id="speed-select" class="speed-dropdown" title="Playback Speed">
                <option value="0.5">0.5x</option>
                <option value="0.75">0.75x</option>
                <option value="1.0" selected>1.0x</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="1.75">1.75x</option>
                <option value="2.0">2.0x</option>
                <option value="2.5">2.5x</option>
                <option value="3.0">3.0x</option>
            </select>
            <button id="boost-btn" class="boost-btn" title="Volume Boost">🔊 Boost</button>
            <button id="unmute-btn" style="background:#2374e1; color:#fff;" title="Force Unmute">🔊</button>
            <button id="skip-back-btn" title="Rewind 10s">⏪</button>
            <button id="skip-fwd-btn" title="Forward 10s">⏩</button>
            <button id="auto-next-btn" class="toggle-active" title="Auto-Play Next Video">🔄 Next</button>
            <button id="glow-btn" title="Cinema Glow Filter">💡</button>
        </div>
    </div>
    
    <!-- 3. Workspace -->
    <div id="workspace">
        <div id="start-hub">
            <div class="hub-title">CINEMASTREAM PRO</div>
            <div class="hub-subtitle">Clean multi-tab video browser</div>
            
            <div class="hub-grid">
                <div class="hub-card" onclick="loadPortal('https://www.facebook.com')">
                    <div class="hub-icon">🌐</div>
                    <div class="hub-name">Facebook Full</div>
                    <div class="hub-tag">Original Layout</div>
                </div>
                <div class="hub-card" onclick="loadPortal('https://www.facebook.com/watch')">
                    <div class="hub-icon">🍿</div>
                    <div class="hub-name">FB Watch</div>
                    <div class="hub-tag">Video Feed</div>
                </div>
                <div class="hub-card" onclick="loadPortal('https://www.youtube.com')">
                    <div class="hub-icon">▶️</div>
                    <div class="hub-name">YouTube</div>
                    <div class="hub-tag">Ad-Skipped</div>
                </div>
                <div class="hub-card" onclick="loadPortal('https://www.facebook.com/reel')">
                    <div class="hub-icon">📱</div>
                    <div class="hub-name">FB Reels</div>
                    <div class="hub-tag">Shorts & Reels</div>
                </div>
                <div class="hub-card" onclick="loadPortal('https://www.tiktok.com')">
                    <div class="hub-icon">🎵</div>
                    <div class="hub-name">TikTok</div>
                    <div class="hub-tag">Mobile Feed</div>
                </div>
                <div class="hub-card" onclick="promptDirectUrl()">
                    <div class="hub-icon">🔗</div>
                    <div class="hub-name">Direct Stream</div>
                    <div class="hub-tag">Custom MP4</div>
                </div>
            </div>
        </div>

        <div id="webviews-container"></div>

        <!-- Watch Later Slide-out Drawer -->
        <div id="watch-later-drawer">
            <div class="drawer-header">
                <span class="drawer-title">⭐ Watch Later Queue</span>
                <button class="drawer-close" id="close-drawer-btn">✕</button>
            </div>
            <div id="wl-list"></div>
        </div>
    </div>

    <script>
        const webviewsContainer = document.getElementById('webviews-container');
        const tabsList = document.getElementById('tabs-list');
        const urlBar = document.getElementById('url-bar');
        const startHub = document.getElementById('start-hub');
        const speedSelect = document.getElementById('speed-select');
        const accountSelect = document.getElementById('account-select');
        const wlDrawer = document.getElementById('watch-later-drawer');
        const wlCountSpan = document.getElementById('wl-count');
        const wlListContainer = document.getElementById('wl-list');

        let tabs = [];
        let activeTabId = null;
        let autoNextEnabled = true;
        let isCinemaMode = false;
        let boostLevel = 1.0;

        // Multi-Account Isolation
        let accounts = JSON.parse(localStorage.getItem('cs_accounts') || '["Account 1", "Account 2"]');
        let currentAccount = localStorage.getItem('cs_active_account') || accounts[0];

        function renderAccountList() {
            accountSelect.innerHTML = '';
            accounts.forEach(acc => {
                const opt = document.createElement('option');
                opt.value = acc;
                opt.innerText = `👤 ${acc}`;
                if (acc === currentAccount) opt.selected = true;
                accountSelect.appendChild(opt);
            });
        }

        accountSelect.addEventListener('change', (e) => {
            currentAccount = e.target.value;
            localStorage.setItem('cs_active_account', currentAccount);
            if (activeTabId) {
                const tab = tabs.find(t => t.id === activeTabId);
                if (tab) {
                    const currentUrl = (tab.webview.getURL && tab.webview.getURL()) || tab.url || 'https://www.facebook.com';
                    closeTab(activeTabId);
                    createTab(currentUrl, 'Facebook');
                }
            }
        });

        document.getElementById('add-account-btn').addEventListener('click', () => {
            const name = prompt("Enter account profile name (e.g., Work, Personal):");
            if (name && !accounts.includes(name.trim())) {
                accounts.push(name.trim());
                currentAccount = name.trim();
                localStorage.setItem('cs_accounts', JSON.stringify(accounts));
                localStorage.setItem('cs_active_account', currentAccount);
                renderAccountList();
                createTab('https://www.facebook.com', 'Facebook');
            }
        });

        renderAccountList();

        // Multi-Tab Engine
        function createTab(url = 'about:blank', title = 'New Tab') {
            const tabId = 'tab_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);

            const wv = document.createElement('webview');
            wv.id = `wv_${tabId}`;
            wv.setAttribute('partition', `persist:profile_${currentAccount.replace(/[^a-zA-Z0-9]/g, '_')}`);
            wv.setAttribute('allowpopups', '');
            wv.setAttribute('useragent', 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36');
            wv.src = url;
            webviewsContainer.appendChild(wv);

            const tabEl = document.createElement('div');
            tabEl.className = 'tab';
            tabEl.id = `tab_btn_${tabId}`;
            tabEl.innerHTML = `
                <span class="tab-title">${title}</span>
                <button class="tab-close" title="Close Tab">✕</button>
            `;

            tabEl.addEventListener('click', (e) => {
                if (!e.target.classList.contains('tab-close')) switchTab(tabId);
            });

            tabEl.querySelector('.tab-close').addEventListener('click', (e) => {
                e.stopPropagation();
                closeTab(tabId);
            });

            tabsList.appendChild(tabEl);

            const tabObj = { id: tabId, tabEl, webview: wv, title, url };
            tabs.push(tabObj);

            attachWebviewListeners(wv, tabObj);
            switchTab(tabId);

            if (url === 'about:blank') {
                startHub.classList.remove('hidden');
            } else {
                startHub.classList.add('hidden');
            }
        }

        function switchTab(tabId) {
            activeTabId = tabId;
            tabs.forEach(t => {
                const isActive = t.id === tabId;
                t.tabEl.classList.toggle('active', isActive);
                t.webview.classList.toggle('active', isActive);
                if (isActive) {
                    const currentUrl = (t.webview.getURL && t.webview.getURL()) || t.url;
                    urlBar.value = (currentUrl === 'about:blank' || !currentUrl) ? '' : currentUrl;
                    if (currentUrl === 'about:blank' || !currentUrl) {
                        startHub.classList.remove('hidden');
                    } else {
                        startHub.classList.add('hidden');
                    }
                }
            });
        }

        function closeTab(tabId) {
            const idx = tabs.findIndex(t => t.id === tabId);
            if (idx === -1) return;

            const tab = tabs[idx];
            tab.tabEl.remove();
            tab.webview.remove();
            tabs.splice(idx, 1);

            if (tabs.length === 0) {
                createTab('about:blank', 'New Tab');
            } else if (activeTabId === tabId) {
                const newIdx = Math.max(0, idx - 1);
                switchTab(tabs[newIdx].id);
            }
        }

        document.getElementById('new-tab-btn').addEventListener('click', () => {
            createTab('about:blank', 'New Tab');
        });

        createTab('about:blank', 'New Tab');

        function getActiveWebview() {
            const tab = tabs.find(t => t.id === activeTabId);
            return tab ? tab.webview : null;
        }

        // =======================================================
        // WATCH LATER (PLAY IN CURRENT TAB)
        // =======================================================
        let watchLaterList = JSON.parse(localStorage.getItem('cs_watch_later') || '[]');

        function updateWatchLaterUI() {
            wlCountSpan.innerText = watchLaterList.length;
            wlListContainer.innerHTML = '';
            if (watchLaterList.length === 0) {
                wlListContainer.innerHTML = '<div style="color:#888; text-align:center; padding:20px;">No saved videos yet.<br>Click "⭐ Save" while watching!</div>';
                return;
            }
            watchLaterList.forEach(item => {
                const card = document.createElement('div');
                card.className = 'wl-card';
                card.innerHTML = `
                    <div class="wl-card-title" title="${item.title}">${item.title}</div>
                    <div style="font-size:10px; color:#8892b0;">Saved: ${item.date}</div>
                    <div class="wl-card-actions">
                        <button class="wl-play-btn">▶ Play</button>
                        <button class="wl-del-btn" title="Remove">🗑️</button>
                    </div>
                `;
                // Play in CURRENT TAB
                card.querySelector('.wl-play-btn').addEventListener('click', () => {
                    const wv = getActiveWebview();
                    if (wv) {
                        wv.src = item.url;
                        urlBar.value = item.url;
                        const tab = tabs.find(t => t.id === activeTabId);
                        if (tab) {
                            tab.title = item.title;
                            tab.tabEl.querySelector('.tab-title').innerText = item.title;
                        }
                        startHub.classList.add('hidden');
                    } else {
                        createTab(item.url, item.title);
                    }
                    wlDrawer.classList.remove('open');
                });
                card.querySelector('.wl-del-btn').addEventListener('click', () => {
                    watchLaterList = watchLaterList.filter(i => i.id !== item.id);
                    localStorage.setItem('cs_watch_later', JSON.stringify(watchLaterList));
                    updateWatchLaterUI();
                });
                wlListContainer.appendChild(card);
            });
        }

        function showNotification(text) {
            const notif = document.createElement('div');
            notif.innerText = text;
            notif.style.cssText = "position:fixed;top:45px;right:20px;background:rgba(20,22,30,0.95);color:#ffd200;padding:10px 18px;border-radius:8px;z-index:999999;font-weight:bold;border:1px solid #ffd200;font-size:12px;";
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 2000);
        }

        document.getElementById('save-wl-btn').addEventListener('click', () => {
            const tab = tabs.find(t => t.id === activeTabId);
            if (!tab || !tab.webview) return;
            const wv = tab.webview;
            
            let currentUrl = (wv.getURL && wv.getURL()) || wv.src || tab.url || urlBar.value;
            if (!currentUrl || currentUrl === 'about:blank') {
                return alert('Please open a video before saving!');
            }

            let title = tab.title && tab.title !== 'New Tab' ? tab.title : (urlBar.value || currentUrl);

            const saveItem = (resolvedTitle) => {
                const newItem = {
                    id: Date.now(),
                    title: resolvedTitle || 'Video Link',
                    url: currentUrl,
                    date: new Date().toLocaleDateString()
                };
                watchLaterList.unshift(newItem);
                localStorage.setItem('cs_watch_later', JSON.stringify(watchLaterList));
                updateWatchLaterUI();
                showNotification(`⭐ Saved: ${newItem.title.slice(0, 25)}...`);
            };

            wv.executeJavaScript('document.title').then(pageTitle => {
                saveItem(pageTitle || title);
            }).catch(() => {
                saveItem(title);
            });
        });

        document.getElementById('watch-later-btn').addEventListener('click', () => {
            updateWatchLaterUI();
            wlDrawer.classList.add('open');
        });

        document.getElementById('close-drawer-btn').addEventListener('click', () => {
            wlDrawer.classList.remove('open');
        });

        updateWatchLaterUI();

        // Injections & Background Play
        const getActiveVideoJS = `
            const vids = Array.from(document.querySelectorAll('video'));
            const activeVideo = vids.find(v => !v.paused && v.readyState > 0) || vids[0];
        `;

        function attachWebviewListeners(wv, tabObj) {
            wv.addEventListener('did-navigate', (e) => {
                if (e.url !== 'about:blank') {
                    tabObj.url = e.url;
                    if (tabObj.id === activeTabId) urlBar.value = e.url;
                    startHub.classList.add('hidden');
                }
            });

            wv.addEventListener('page-title-updated', (e) => {
                tabObj.title = e.title;
                tabObj.tabEl.querySelector('.tab-title').innerText = e.title;
            });

            wv.addEventListener('dom-ready', () => {
                wv.insertCSS(`.ad-container, .sponsored-post, [aria-label="Sponsored"] { display: none !important; }`);

                wv.executeJavaScript(`
                    (function() {
                        try {
                            Object.defineProperty(document, 'hidden', { value: false, writable: false });
                            Object.defineProperty(document, 'visibilityState', { value: 'visible', writable: false });
                            window.addEventListener('visibilitychange', (e) => e.stopImmediatePropagation(), true);
                        } catch(err) {}

                        setInterval(() => {
                            const skipSelectors = ['.ytp-ad-skip-button', '.ytp-ad-skip-button-modern', '.ytp-skip-ad-button', '[id^="skip-button"] button', '[aria-label*="Skip Ad" i]', '.videoAdUiSkipButton', '.ytp-ad-overlay-close-button'];
                            skipSelectors.forEach(s => document.querySelectorAll(s).forEach(b => b.click()));
                            const adShowing = document.querySelector('.ad-showing, .ytp-ad-player-overlay');
                            if (adShowing) { const vid = document.querySelector('video'); if (vid) { vid.playbackRate = 16.0; vid.muted = true; } }
                        }, 500);

                        setInterval(() => {
                            document.querySelectorAll('video').forEach(v => { if (v.muted && !document.querySelector('.ad-showing')) { v.muted = false; v.volume = 1.0; } });
                            document.querySelectorAll('[aria-label*="unmute" i], [aria-label*="Unmute" i]').forEach(b => b.click());
                        }, 800);

                        document.addEventListener('ended', (e) => {
                            if (e.target && e.target.tagName === 'VIDEO') {
                                const vids = Array.from(document.querySelectorAll('video'));
                                const currentIdx = vids.indexOf(e.target);
                                if (currentIdx !== -1 && currentIdx + 1 < vids.length) {
                                    const nextVid = vids[currentIdx + 1];
                                    nextVid.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                    setTimeout(() => { nextVid.muted = false; nextVid.volume = 1.0; nextVid.play().catch(()=>{}); }, 700);
                                } else {
                                    window.scrollBy({ top: window.innerHeight * 0.9, behavior: 'smooth' });
                                }
                            }
                        }, true);

                        const showToast = (text) => {
                            let t = document.getElementById('cinema-hotkey-toast');
                            if (!t) { t = document.createElement('div'); t.id = 'cinema-hotkey-toast'; document.body.appendChild(t); }
                            t.innerText = text;
                            t.style.cssText = "position:fixed;top:30px;left:50%;transform:translateX(-50%);background:rgba(11,12,16,0.92);color:#00f2fe;padding:10px 22px;border-radius:10px;z-index:99999999;font-size:20px;font-weight:bold;border:1px solid #00f2fe;pointer-events:none;";
                            clearTimeout(window.__tTime); window.__tTime = setTimeout(() => { if (t) t.remove(); }, 1200);
                        };

                        window.addEventListener('keydown', (e) => {
                            if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
                            const vids = Array.from(document.querySelectorAll('video'));
                            const v = vids.find(v => !v.paused && v.readyState > 0) || vids[0];
                            if (!v) return;

                            if (e.shiftKey && (e.key === '+' || e.key === '=' || e.code === 'NumpadAdd')) {
                                e.preventDefault(); v.playbackRate = Math.min(3.5, +(v.playbackRate + 0.25).toFixed(2)); showToast("⚡ Speed: " + v.playbackRate + "x");
                            } else if (e.shiftKey && (e.key === '_' || e.key === '-' || e.code === 'NumpadSubtract')) {
                                e.preventDefault(); v.playbackRate = Math.max(0.25, +(v.playbackRate - 0.25).toFixed(2)); showToast("⚡ Speed: " + v.playbackRate + "x");
                            } else if (!e.shiftKey && (e.key === '+' || e.key === '=' || e.code === 'NumpadAdd')) {
                                e.preventDefault(); v.volume = Math.min(1.0, +(v.volume + 0.1).toFixed(2)); showToast("🔊 Volume: " + Math.round(v.volume * 100) + "%");
                            } else if (!e.shiftKey && (e.key === '-' || e.code === 'NumpadSubtract')) {
                                e.preventDefault(); v.volume = Math.max(0.0, +(v.volume - 0.1).toFixed(2)); showToast("🔉 Volume: " + Math.round(v.volume * 100) + "%");
                            } else if (e.code === 'Space') { e.preventDefault(); v.paused ? v.play() : v.pause(); }
                            else if (e.code === 'KeyF') { e.preventDefault(); (v.parentElement || v).requestFullscreen(); }
                            else if (e.code === 'KeyM') { e.preventDefault(); v.muted = !v.muted; showToast(v.muted ? "🔇 Muted" : "🔊 Unmuted"); }
                            else if (e.code === 'ArrowRight') { e.preventDefault(); v.currentTime += 10; }
                            else if (e.code === 'ArrowLeft') { e.preventDefault(); v.currentTime -= 10; }
                        });
                    })();
                `, true);
            });
        }

        // Toolbar Buttons Handlers
        function loadPortal(url) {
            urlBar.value = url;
            const wv = getActiveWebview();
            if (wv) wv.src = url;
            startHub.classList.add('hidden');
        }

        function promptDirectUrl() {
            const url = prompt("Enter Direct MP4 link or Video Webpage URL:");
            if (url) loadPortal(url);
        }

        document.getElementById('hub-toggle').addEventListener('click', () => {
            startHub.classList.toggle('hidden');
        });

        function navigate() {
            let url = urlBar.value.trim();
            if (!url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
            const wv = getActiveWebview();
            if (wv) wv.src = url;
            startHub.classList.add('hidden');
        }

        document.getElementById('go-btn').addEventListener('click', navigate);
        urlBar.addEventListener('keypress', (e) => { if (e.key === 'Enter') navigate(); });
        document.getElementById('back-btn').addEventListener('click', () => { const wv = getActiveWebview(); if (wv) wv.goBack(); });
        document.getElementById('forward-btn').addEventListener('click', () => { const wv = getActiveWebview(); if (wv) wv.goForward(); });

        document.getElementById('view-mode-btn').addEventListener('click', () => {
            isCinemaMode = !isCinemaMode;
            document.getElementById('view-mode-btn').innerText = isCinemaMode ? '🍿 Cinema' : '🌐 View';
            const wv = getActiveWebview();
            if (wv) {
                wv.executeJavaScript(`
                    (function() {
                        const existing = document.getElementById('cinema-cards-style');
                        if (existing) { existing.remove(); return; }
                        const style = document.createElement('style');
                        style.id = 'cinema-cards-style';
                        style.innerHTML = \`
                            [role="banner"], [role="navigation"], [role="complementary"], #leftCol, #rightCol, [aria-label="Stories"], form[role="search"] { display: none !important; }
                            body, html, [role="main"] { background-color: #0b0c10 !important; color: #c5c6c7 !important; }
                            [role="feed"] > div, div[data-pagelet*="Feed"] { background: #151821 !important; border-radius: 20px !important; margin: 30px auto !important; max-width: 900px !important; padding: 20px !important; border: 1px solid #232738 !important; }
                            video { border-radius: 14px !important; max-height: 80vh !important; width: 100% !important; }
                        \`;
                        document.head.appendChild(style);
                    })();
                `, true);
            }
        });

        document.getElementById('hide-feed-btn').addEventListener('click', () => {
            const wv = getActiveWebview();
            if (wv) {
                wv.executeJavaScript(`
                    (function() {
                        const existing = document.getElementById('hide-all-clutter-style');
                        if (existing) { existing.remove(); return; }
                        const style = document.createElement('style');
                        style.id = 'hide-all-clutter-style';
                        style.innerHTML = \`
                            form, input, [role="article"] div[aria-label*="Comment" i], [aria-label*="Like" i], [aria-label*="Share" i], [aria-label*="Leave a comment" i], div[data-pagelet*="Comment"], div[data-pagelet*="Reactions"], #comments, ytd-comments, #below { display: none !important; }
                        \`;
                        document.head.appendChild(style);
                    })();
                `, true);
            }
        });

        document.getElementById('blackout-btn').addEventListener('click', () => {
            const wv = getActiveWebview();
            if (wv) {
                wv.executeJavaScript(`
                    (function() {
                        const existingStage = document.getElementById('pure-blackout-stage');
                        if (existingStage) { existingStage.remove(); return; }
                        ${getActiveVideoJS}
                        if (!activeVideo) return alert("Please start playing a video first!");
                        const style = document.createElement('style');
                        style.id = 'pure-blackout-stage';
                        style.innerHTML = \`
                            body * { visibility: hidden !important; }
                            video, video * { visibility: visible !important; }
                            video { position: fixed !important; top: 50% !important; left: 50% !important; transform: translate(-50%, -50%) !important; width: 95vw !important; height: 90vh !important; z-index: 2147483647 !important; background: #000 !important; object-fit: contain !important; box-shadow: 0 0 60px rgba(0, 242, 254, 0.3) !important; }
                            html, body { background: #000 !important; overflow: hidden !important; }
                        \`;
                        document.head.appendChild(style);
                    })();
                `, true);
            }
        });

        document.getElementById('boost-btn').addEventListener('click', (e) => {
            boostLevel = (boostLevel === 1.0) ? 2.0 : (boostLevel === 2.0 ? 3.0 : 1.0);
            e.target.innerText = `🔊 ${Math.round(boostLevel * 100)}%`;
            const wv = getActiveWebview();
            if (wv) {
                wv.executeJavaScript(`
                    (function() {
                        ${getActiveVideoJS}
                        if (!activeVideo) return;
                        if (!window.__audioCtx) {
                            window.__audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                            window.__gainNode = window.__audioCtx.createGain();
                            const source = window.__audioCtx.createMediaElementSource(activeVideo);
                            source.connect(window.__gainNode);
                            window.__gainNode.connect(window.__audioCtx.destination);
                        }
                        window.__gainNode.gain.value = ${boostLevel};
                    })();
                `, true);
            }
        });

        speedSelect.addEventListener('change', (e) => {
            const speed = e.target.value;
            const wv = getActiveWebview();
            if (wv) wv.executeJavaScript(`(function() { ${getActiveVideoJS} if (activeVideo) activeVideo.playbackRate = ${speed}; })();`, true);
        });

        document.getElementById('focus-btn').addEventListener('click', () => {
            const wv = getActiveWebview();
            if (wv) wv.executeJavaScript(`(function() { ${getActiveVideoJS} if (!activeVideo) return alert("Play video first!"); document.fullscreenElement ? document.exitFullscreen() : (activeVideo.parentElement.parentElement || activeVideo).requestFullscreen(); })();`, true);
        });

        document.getElementById('pip-btn').addEventListener('click', () => {
            const wv = getActiveWebview();
            if (wv) wv.executeJavaScript(`(function() { ${getActiveVideoJS} if (!activeVideo) return alert("Play video first!"); document.pictureInPictureElement ? document.exitPictureInPicture() : activeVideo.requestPictureInPicture(); })();`, true);
        });

        document.getElementById('glow-btn').addEventListener('click', () => {
            const wv = getActiveWebview();
            if (wv) wv.executeJavaScript(`(function() { ${getActiveVideoJS} if (!activeVideo) return; activeVideo.style.filter = activeVideo.style.filter ? '' : 'contrast(1.15) brightness(1.08) saturate(1.15)'; })();`, true);
        });

        document.getElementById('skip-fwd-btn').addEventListener('click', () => {
            const wv = getActiveWebview();
            if (wv) wv.executeJavaScript(`(function() { ${getActiveVideoJS} if (activeVideo) activeVideo.currentTime += 10; })();`, true);
        });
        document.getElementById('skip-back-btn').addEventListener('click', () => {
            const wv = getActiveWebview();
            if (wv) wv.executeJavaScript(`(function() { ${getActiveVideoJS} if (activeVideo) activeVideo.currentTime -= 10; })();`, true);
        });

        document.getElementById('unmute-btn').addEventListener('click', () => {
            const wv = getActiveWebview();
            if (wv) wv.executeJavaScript(`(function() { document.querySelectorAll('video').forEach(v => { v.muted = false; v.volume = 1.0; }); document.querySelectorAll('[aria-label*="unmute" i], [aria-label*="Unmute" i]').forEach(b => b.click()); })();`, true);
        });

        document.getElementById('auto-next-btn').addEventListener('click', (e) => {
            autoNextEnabled = !autoNextEnabled;
            e.target.innerText = `🔄 ${autoNextEnabled ? 'Next' : 'Off'}`;
            e.target.classList.toggle('toggle-active', autoNextEnabled);
        });

    </script>
</body>
</html>
